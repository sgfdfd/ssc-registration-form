<!DOCTYPE html>
<html lang="en">
<head>
  <title>Failed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070b1e;
      overflow: hidden;
      padding: 24px 16px;
      position: relative;
    }

    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      animation: blobFloat 20s ease-in-out infinite;
    }

    .blob-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #f87171, #dc2626);
      top: -15%; left: -10%;
      animation-duration: 22s;
    }

    .blob-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #fca5a5, #ef4444);
      bottom: -15%; right: -8%;
      animation-delay: -7s;
      animation-duration: 18s;
    }

    .blob-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, #4f6cff, #7c3aed);
      top: 40%; left: 60%;
      animation-delay: -12s;
      animation-duration: 25s;
    }

    .blob-4 {
      width: 240px; height: 240px;
      background: radial-gradient(circle, #fb923c, #f43f5e);
      top: 60%; left: 10%;
      animation-delay: -4s;
      animation-duration: 20s;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(45px, -30px) scale(1.06); }
      50% { transform: translate(-20px, 50px) scale(0.95); }
      75% { transform: translate(30px, 20px) scale(1.04); }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translateY(-8vh) translateX(25px); opacity: 0; }
    }

    /* Error particles */
    .error-particles {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .error-spark {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(248,113,113,0.6);
      border-radius: 50%;
      animation: sparkFade 2s ease-out forwards;
    }

    @keyframes sparkFade {
      0% { transform: scale(0); opacity: 1; }
      50% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* === GLASS CARD === */
    .glass-card {
      position: relative;
      z-index: 10;
      width: 460px;
      max-width: 100%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(44px);
      -webkit-backdrop-filter: blur(44px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 48px 36px 40px;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.15);
      text-align: center;
      animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(50px) scale(0.95); filter: blur(12px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* Error Icon */
    .error-icon-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
    }

    .error-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(248,113,113,0.2);
      animation: ringPulse 2.5s ease-in-out infinite;
    }

    .error-ring-2 {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(248,113,113,0.08);
      animation: ringPulse 2.5s ease-in-out 0.4s infinite;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.5; }
    }

    .error-icon {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #f87171, #dc2626);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 30px rgba(248,113,113,0.4);
      animation: iconBounceIn 0.7s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes iconBounceIn {
      from { transform: scale(0) rotate(-10deg); }
      to { transform: scale(1) rotate(0deg); }
    }

    .error-icon svg {
      width: 44px; height: 44px;
      stroke: #fff; fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawX 0.5s 0.7s ease forwards;
    }

    @keyframes drawX {
      to { stroke-dashoffset: 0; }
    }

    /* Shake after draw */
    .error-icon-wrap {
      animation: shakeOnce 0.5s 1.2s ease both;
    }

    @keyframes shakeOnce {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-6px) rotate(-2deg); }
      30% { transform: translateX(5px) rotate(2deg); }
      45% { transform: translateX(-4px) rotate(-1deg); }
      60% { transform: translateX(3px) rotate(1deg); }
      75% { transform: translateX(-2px); }
      90% { transform: translateX(1px); }
    }

    /* Text */
    .error-title {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      animation: textIn 0.6s 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    .error-title .emoji {
      display: inline-block;
      animation: emojiPop 0.5s 0.9s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes emojiPop {
      from { transform: scale(0) rotate(20deg); }
      to { transform: scale(1) rotate(0deg); }
    }

    .error-sub {
      color: rgba(255,255,255,0.45);
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.7;
      margin-bottom: 6px;
      animation: textIn 0.6s 0.75s cubic-bezier(0.16,1,0.3,1) both;
    }

    .error-bn {
      color: rgba(255,255,255,0.6);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.7;
      margin-bottom: 32px;
      animation: textIn 0.6s 0.85s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes textIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Info Cards */
    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
      animation: textIn 0.6s 0.95s cubic-bezier(0.16,1,0.3,1) both;
    }

    .info-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 16px 14px;
      text-align: center;
    }

    .info-card .info-emoji {
      font-size: 22px;
      margin-bottom: 8px;
      display: block;
    }

    .info-card .info-label {
      color: rgba(255,255,255,0.3);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-card .info-value {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 500;
    }

    .info-card.error-card {
      background: rgba(248,113,113,0.06);
      border-color: rgba(248,113,113,0.1);
    }

    .info-card.error-card .info-value {
      color: #fca5a5;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      animation: textIn 0.6s 1.05s cubic-bezier(0.16,1,0.3,1) both;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      background: linear-gradient(135deg, #f87171, #dc2626);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 4px 20px rgba(248,113,113,0.3);
      position: relative;
      overflow: hidden;
    }

    .retry-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: translateX(-110%);
      transition: transform 0.6s;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(248,113,113,0.45);
    }

    .retry-btn:hover::before {
      transform: translateX(110%);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .retry-btn svg {
      width: 16px; height: 16px;
      stroke: #fff; fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s;
    }

    .retry-btn:hover svg {
      transform: rotate(180deg);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    .home-btn svg {
      width: 16px; height: 16px;
      stroke: rgba(255,255,255,0.5);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s;
    }

    .home-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }

    .home-btn:hover svg {
      stroke: #fff;
      transform: translateX(-3px);
    }

    .home-btn:active {
      transform: translateY(0);
    }

    .footer-note {
      color: rgba(255,255,255,0.2);
      font-size: 11.5px;
      margin-top: 20px;
      animation: textIn 0.6s 1.15s cubic-bezier(0.16,1,0.3,1) both;
    }

    @media (max-width: 480px) {
      .glass-card {
        padding: 36px 24px 32px;
        border-radius: 22px;
      }

      .error-title { font-size: 22px; }
      .info-row { grid-template-columns: 1fr; }
      .btn-row { flex-direction: column; }
      .retry-btn, .home-btn { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .particle, .error-ring, .error-ring-2 { animation: none !important; }
      .glass-card, .error-icon, .error-title, .error-sub, .error-bn,
      .info-row, .btn-row, .footer-note, .error-title .emoji,
      .error-icon-wrap {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .error-icon svg { stroke-dashoffset: 0 !important; }
      .retry-btn:hover, .home-btn:hover { transform: none; }
      .error-spark { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg-canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="grid-overlay"></div>
  <div class="particles" id="particles"></div>
  <div class="error-particles" id="errorParticles"></div>

  <div class="glass-card">

    <div class="error-icon-wrap">
      <div class="error-ring"></div>
      <div class="error-ring-2"></div>
      <div class="error-icon">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
    </div>

    <h1 class="error-title"><span class="emoji">😞</span> দুঃখিত!</h1>
    <p class="error-sub">Something went wrong. Your registration could not be completed.</p>
    <p class="error-bn">আপনার রেজিস্ট্রেশন ব্যর্থ হয়েছে। আবার চেষ্টা করুন।</p>

    <div class="info-row">
      <div class="info-card error-card">
        <span class="info-emoji">⚠️</span>
        <div class="info-label">Status</div>
        <div class="info-value">Failed</div>
      </div>
      <div class="info-card">
        <span class="info-emoji">💡</span>
        <div class="info-label">Suggestion</div>
        <div class="info-value">Try Again</div>
      </div>
    </div>

    <div class="btn-row">
      <a href="index.html" class="retry-btn">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Try Again
      </a>
      <a href="index.html" class="home-btn">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Home
      </a>
    </div>

    <p class="footer-note">If the problem persists, contact support.</p>
  </div>

  <script>
    /* Background particles */
    (function() {
      const box = document.getElementById('particles');
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (10 + Math.random() * 16) + 's';
        p.style.animationDelay = -(Math.random() * 20) + 's';
        const s = 1.5 + Math.random() * 2;
        p.style.width = p.style.height = s + 'px';
        p.style.opacity = 0.1 + Math.random() * 0.25;
        box.appendChild(p);
      }
    })();

    /* Error sparks around icon */
    (function() {
      const container = document.getElementById('errorParticles');
      const card = document.querySelector('.glass-card');

      function createSparks() {
        const cardRect = card.getBoundingClientRect();
        const cx = cardRect.left + cardRect.width / 2;
        const cy = cardRect.top + 100;

        for (let i = 0; i < 12; i++) {
          const spark = document.createElement('div');
          spark.className = 'error-spark';
          const angle = (Math.PI * 2 / 12) * i;
          const dist = 40 + Math.random() * 30;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          spark.style.left = x + 'px';
          spark.style.top = y + 'px';
          const s = 2 + Math.random() * 3;
          spark.style.width = spark.style.height = s + 'px';
          spark.style.animationDuration = (1.5 + Math.random() * 1) + 's';
          container.appendChild(spark);

          setTimeout(() => spark.remove(), 2500);
        }
      }

      /* Fire sparks after the icon shake */
      setTimeout(createSparks, 1300);

      /* Repeat sparks every 4 seconds */
      setInterval(createSparks, 4000);
    })();
  </script>

</body>
</html>
