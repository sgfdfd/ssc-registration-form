<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family: Arial; padding:20px;">

<h2>Registration Form</h2>

<form id="regForm">

  <input id="name" placeholder="Full Name" required><br><br>
  <input id="school" placeholder="School Name" required><br><br>
  <input id="mobile" placeholder="Mobile (01XXXXXXXXX)" required><br><br>
  <input id="email" placeholder="Email" required><br><br>

  <select id="board" required>
    <option value="">Select Board</option>
    <option value="dhaka">Dhaka</option>
    <option value="rajshahi">Rajshahi</option>
  </select><br><br>

  <input id="district" placeholder="District" required><br><br>

  <input id="paymentNumber" placeholder="Payment Number" required><br><br>
  <input id="transactionId" placeholder="Transaction ID" required><br><br>

  <button type="button" onclick="submitForm()">Submit</button>

</form>

<p id="msg"></p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzMPU6thUFOh9BiGo_hLwxzANOqbB4cqxo8RdkrXVjgPum9RHtX6ecG1dCXtX8qRiQTuA/exec";

function submitForm() {

  const data = {
    name: document.getElementById("name").value.trim(),
    school: document.getElementById("school").value.trim(),
    mobile: document.getElementById("mobile").value.trim(),
    email: document.getElementById("email").value.trim(),
    board: document.getElementById("board").value,
    district: document.getElementById("district").value.trim(),
    paymentNumber: document.getElementById("paymentNumber").value.trim(),
    transactionId: document.getElementById("transactionId").value.trim()
  };

  // simple validation
  for (let key in data) {
    if (!data[key]) {
      document.getElementById("msg").innerText = "সব ফিল্ড পূরণ করুন";
      return;
    }
  }

  document.getElementById("msg").innerText = "Submitting...";

  fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(res => {
    try {
      const result = JSON.parse(res);

      if (result.status === "success") {
        document.getElementById("msg").innerText = "✅ Registration Successful";
        document.getElementById("regForm").reset();
      } else {
        document.getElementById("msg").innerText = "❌ Failed: " + (result.message || "Error");
      }

    } catch (e) {
      document.getElementById("msg").innerText = "Server Response Error";
    }
  })
  .catch(err => {
    document.getElementById("msg").innerText = "Network Error";
    console.log(err);
  });

}
</script>

</body>
</html>
