<!DOCTYPE html>
<html lang="en">
<head>
  <title>Success</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070b1e;
      overflow: hidden;
      padding: 24px 16px;
      position: relative;
    }

    /* === BACKGROUND === */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      animation: blobFloat 20s ease-in-out infinite;
    }

    .blob-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #34d399, #059669);
      top: -15%; left: -10%;
      animation-duration: 22s;
    }

    .blob-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #6ee7b7, #10b981);
      bottom: -15%; right: -8%;
      animation-delay: -7s;
      animation-duration: 18s;
    }

    .blob-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, #4f6cff, #7c3aed);
      top: 40%; left: 60%;
      animation-delay: -12s;
      animation-duration: 25s;
    }

    .blob-4 {
      width: 240px; height: 240px;
      background: radial-gradient(circle, #a7f3d0, #06b6d4);
      top: 60%; left: 10%;
      animation-delay: -4s;
      animation-duration: 20s;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(45px, -30px) scale(1.06); }
      50% { transform: translate(-20px, 50px) scale(0.95); }
      75% { transform: translate(30px, 20px) scale(1.04); }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { transform: translateY(-8vh) translateX(25px); opacity: 0; }
    }

    /* === CONFETTI === */
    .confetti-container {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      top: -10px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg) scale(0.5); opacity: 0; }
    }

    /* === GLASS CARD === */
    .glass-card {
      position: relative;
      z-index: 10;
      width: 460px;
      max-width: 100%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(44px);
      -webkit-backdrop-filter: blur(44px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 48px 36px 40px;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.15);
      text-align: center;
      animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(50px) scale(0.95); filter: blur(12px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* Success Icon */
    .success-icon-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
    }

    .success-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(52,211,153,0.2);
      animation: ringPulse 2.5s ease-in-out infinite;
    }

    .success-ring-2 {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(52,211,153,0.08);
      animation: ringPulse 2.5s ease-in-out 0.4s infinite;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.5; }
    }

    .success-icon {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #34d399, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 30px rgba(52,211,153,0.4);
      animation: iconBounceIn 0.7s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes iconBounceIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .success-icon svg {
      width: 44px; height: 44px;
      stroke: #fff; fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 0.5s 0.7s ease forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* Text */
    .success-title {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      animation: textIn 0.6s 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    .success-title .emoji {
      display: inline-block;
      animation: emojiPop 0.5s 0.9s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes emojiPop {
      from { transform: scale(0) rotate(-20deg); }
      to { transform: scale(1) rotate(0deg); }
    }

    .success-sub {
      color: rgba(255,255,255,0.45);
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.7;
      margin-bottom: 6px;
      animation: textIn 0.6s 0.75s cubic-bezier(0.16,1,0.3,1) both;
    }

    .success-bn {
      color: rgba(255,255,255,0.6);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.7;
      margin-bottom: 32px;
      animation: textIn 0.6s 0.85s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes textIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Info Cards */
    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
      animation: textIn 0.6s 0.95s cubic-bezier(0.16,1,0.3,1) both;
    }

    .info-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 16px 14px;
      text-align: center;
    }

    .info-card .info-emoji {
      font-size: 22px;
      margin-bottom: 8px;
      display: block;
    }

    .info-card .info-label {
      color: rgba(255,255,255,0.3);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-card .info-value {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 500;
    }

    /* Back Button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 32px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      animation: textIn 0.6s 1.05s cubic-bezier(0.16,1,0.3,1) both;
    }

    .back-btn svg {
      width: 16px; height: 16px;
      stroke: rgba(255,255,255,0.5);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }

    .back-btn:hover svg {
      stroke: #fff;
      transform: translateX(-3px);
    }

    .back-btn:active {
      transform: translateY(0);
    }

    /* Footer note */
    .footer-note {
      color: rgba(255,255,255,0.2);
      font-size: 11.5px;
      margin-top: 20px;
      animation: textIn 0.6s 1.15s cubic-bezier(0.16,1,0.3,1) both;
    }

    @media (max-width: 480px) {
      .glass-card {
        padding: 36px 24px 32px;
        border-radius: 22px;
      }

      .success-title { font-size: 22px; }
      .info-row { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .particle, .success-ring, .success-ring-2 { animation: none !important; }
      .glass-card, .success-icon, .success-title, .success-sub, .success-bn,
      .info-row, .back-btn, .footer-note, .success-title .emoji {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .success-icon svg { stroke-dashoffset: 0 !important; }
      .back-btn:hover { transform: none; }
      .confetti { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg-canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div class="grid-overlay"></div>
  <div class="particles" id="particles"></div>
  <div class="confetti-container" id="confetti"></div>

  <div class="glass-card">

    <div class="success-icon-wrap">
      <div class="success-ring"></div>
      <div class="success-ring-2"></div>
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
    </div>

    <h1 class="success-title"><span class="emoji">🎉</span> অভিনন্দন!</h1>
    <p class="success-sub">Your registration has been completed successfully.</p>
    <p class="success-bn">আপনার রেজিস্ট্রেশন সফল হয়েছে।</p>

    <div class="info-row">
      <div class="info-card">
        <span class="info-emoji">✅</span>
        <div class="info-label">Status</div>
        <div class="info-value">Confirmed</div>
      </div>
      <div class="info-card">
        <span class="info-emoji">📧</span>
        <div class="info-label">Next Step</div>
        <div class="info-value">Check Email</div>
      </div>
    </div>

    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Home
    </a>

    <p class="footer-note">You may close this tab now.</p>
  </div>

  <script>
    /* Particles */
    (function() {
      const box = document.getElementById('particles');
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (10 + Math.random() * 16) + 's';
        p.style.animationDelay = -(Math.random() * 20) + 's';
        const s = 1.5 + Math.random() * 2;
        p.style.width = p.style.height = s + 'px';
        p.style.opacity = 0.1 + Math.random() * 0.25;
        box.appendChild(p);
      }
    })();

    /* Confetti Burst */
    (function() {
      const container = document.getElementById('confetti');
      const colors = ['#34d399', '#6ee7b7', '#4f6cff', '#a855f7', '#fbbf24', '#f472b6', '#38bdf8', '#fb923c'];
      const shapes = ['circle', 'square', 'rect'];

      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        const color = colors[Math.floor(Math.random() * colors.length)];
        const shape = shapes[Math.floor(Math.random() * shapes.length)];

        el.style.left = (10 + Math.random() * 80) + '%';
        el.style.animationDuration = (2 + Math.random() * 3) + 's';
        el.style.animationDelay = (Math.random() * 1.2) + 's';
        el.style.background = color;

        if (shape === 'circle') {
          el.style.borderRadius = '50%';
          const s = 5 + Math.random() * 7;
          el.style.width = el.style.height = s + 'px';
        } else if (shape === 'square') {
          const s = 5 + Math.random() * 6;
          el.style.width = el.style.height = s + 'px';
          el.style.borderRadius = '2px';
        } else {
          el.style.width = (4 + Math.random() * 5) + 'px';
          el.style.height = (10 + Math.random() * 14) + 'px';
          el.style.borderRadius = '2px';
        }

        container.appendChild(el);
      }
    })();
  </script>

</body>
</html>
